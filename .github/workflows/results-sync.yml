name: results-sync

# Every 10 minutes: the site looks at matches that ended 20 minutes ago or earlier and enters their
# results (D-127). With no such match it answers at once and does not ask the results source.
# GitHub runs scheduled workflows only from the default branch, so this one starts after a release.
# Secret: CRON_SECRET (the same value is the CRON_SECRET variable of the Railway service).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAND_URL: https://dazby-production.up.railway.app
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Enter the results of finished matches
        run: |
          if [ -z "$CRON_SECRET" ]; then
            # Not an error: until the owner sets the secret the automatic results are simply off, and
            # a failing run every 10 minutes would only send e-mails (docs/SETUP.md, section J).
            echo "::warning::CRON_SECRET is not set: automatic results are off. See docs/SETUP.md, section J."
            exit 0
          fi
          curl -fsS --max-time 90 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$STAND_URL/api/cron/results" | jq -c '{due, toursAsked, updated: (.updated | length), waiting, attention}'
