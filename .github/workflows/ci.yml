name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Public (non-secret) values of the dev Supabase project, same as .env.example.
      NEXT_PUBLIC_SUPABASE_URL: https://lrybmorjxxbogbmmpddj.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_GgweOwuWyidSPX_uWXpcvQ_uJgnxI0K
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      YOUTUBE_CHANNEL_ID: UCsfcA6cY0bSL781TE3XMEPA
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Applied migrations are immutable
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- supabase/migrations | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "::error::Existing migrations must not be edited or deleted; add a new migration instead."
            echo "$changed"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: No server secrets in the client bundle
        run: |
          if grep -rlE "sb_secret_[A-Za-z0-9_-]{20,}|SUPABASE_SECRET_KEY" .next/static; then
            echo "::error::Server secret name or value found in .next/static"
            exit 1
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
